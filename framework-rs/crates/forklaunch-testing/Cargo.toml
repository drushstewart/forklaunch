[package]
name = "forklaunch-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
benchmarks = ["dep:anyhow", "dep:axum", "dep:tokio", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:garde", "dep:schemars", "dep:forklaunch-axum", "dep:forklaunch-contract", "dep:forklaunch-validation", "dep:forklaunch-ws", "dep:forklaunch-infrastructure-redis", "dep:forklaunch-infrastructure-s3", "dep:forklaunch-sdk-codegen", "dep:forklaunch-sdk-typescript"]

[[example]]
name = "runtime_benchmarks"
required-features = ["benchmarks"]

[dependencies]
forklaunch-core = { path = "../forklaunch-core" }

anyhow = { version = "1", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
garde = { version = "0.20", features = ["derive"], optional = true }
schemars = { version = "0.8", optional = true }
forklaunch-axum = { path = "../forklaunch-axum", features = ["websocket"], optional = true }
forklaunch-contract = { path = "../forklaunch-contract", optional = true }
forklaunch-validation = { path = "../forklaunch-validation", optional = true }
forklaunch-ws = { path = "../forklaunch-ws", features = ["transport"], optional = true }
forklaunch-infrastructure-redis = { path = "../forklaunch-infrastructure-redis", features = ["redis-client"], optional = true }
forklaunch-infrastructure-s3 = { path = "../forklaunch-infrastructure-s3", features = ["aws-sdk"], optional = true }
forklaunch-sdk-codegen = { path = "../forklaunch-sdk-codegen", optional = true }
forklaunch-sdk-typescript = { path = "../forklaunch-sdk-typescript", optional = true }

[lints]
workspace = true
