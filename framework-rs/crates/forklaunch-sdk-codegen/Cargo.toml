[package]
description = "ForkLaunch Rust sdk codegen APIs and runtime support"
name = "forklaunch-sdk-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
zod-uri = ["forklaunch-ws/zod-uri"]

[dependencies]
url = "2"
anyhow = "1"
convert_case = "0.8"
ramhorns = "1.0.1"
percent-encoding = "2.3"
serde_json = "=1.0.151"
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract", features = ["json-schema"] }
forklaunch-ws = { version = "0.1.0", path = "../forklaunch-ws", features = ["json-schema"] }

[lints]
workspace = true
