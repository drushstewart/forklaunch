[package]
description = "ForkLaunch Rust validation APIs and runtime support"
name = "forklaunch-validation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
zod-regex = ["forklaunch-common/zod-regex"]
default = []
zod-uri = ["dep:ada-url"]

[dependencies]
ada-url = { version = "=3.2.4", optional = true }
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common", features = ["zod-checks"] }
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract" }
forklaunch-http = { version = "0.1.0", path = "../forklaunch-http" }

serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
ryu-js = "=1.0.3"
schemars = "0.8"
garde = { version = "0.20", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
