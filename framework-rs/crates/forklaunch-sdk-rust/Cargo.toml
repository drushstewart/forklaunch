[package]
description = "ForkLaunch Rust sdk rust APIs and runtime support"
name = "forklaunch-sdk-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
zod-checks = ["forklaunch-sdk-codegen/zod-checks"]
default = []
zod-uri = ["forklaunch-sdk-codegen/zod-uri"]

[dependencies]
anyhow = "1"
ramhorns = "1.0.1"
serde_json = "=1.0.151"
forklaunch-sdk-codegen = { version = "0.1.0", path = "../forklaunch-sdk-codegen" }

[dev-dependencies]
forklaunch-ws = { version = "0.1.0", path = "../forklaunch-ws" }
serde_json = "=1.0.151"
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract" }

[lints]
workspace = true
