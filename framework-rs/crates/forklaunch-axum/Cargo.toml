[package]
name = "forklaunch-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["adapter"]
adapter = ["dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:bytes", "dep:form_urlencoded"]

[dependencies]
forklaunch-common = { path = "../forklaunch-common" }
forklaunch-contract = { path = "../forklaunch-contract" }
forklaunch-core = { path = "../forklaunch-core" }
forklaunch-http = { path = "../forklaunch-http" }
forklaunch-auth = { path = "../forklaunch-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
opentelemetry = "0.31"
forklaunch-openapi = { path = "../forklaunch-openapi" }

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "request-id", "util"], optional = true }
form_urlencoded = { version = "1", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
