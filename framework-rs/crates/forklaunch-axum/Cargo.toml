[package]
description = "ForkLaunch Rust axum APIs and runtime support"
name = "forklaunch-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["adapter"]
zod-uri = ["dep:forklaunch-validation", "forklaunch-validation/zod-uri"]
cookie-session = ["adapter", "dep:tower-sessions", "dep:subtle", "dep:rand", "dep:url"]
multipart = ["adapter", "axum/multipart", "dep:forklaunch-validation"]
sse = ["adapter", "dep:futures-util", "dep:forklaunch-validation"]
websocket = ["adapter", "axum/ws", "dep:forklaunch-ws", "dep:futures-util"]
mcp = ["adapter", "dep:forklaunch-mcp", "tokio/sync", "tokio/time"]
remote-jwks = ["adapter", "forklaunch-auth/remote-jwks", "dep:jsonwebtoken"]
adapter = ["dep:uuid", "tokio/time", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:bytes", "dep:form_urlencoded", "dep:http-body", "dep:http-body-util"]

[dependencies]
uuid = { version = "1", features = ["v4"], optional = true }
tower-sessions = { version = "0.15", optional = true }
subtle = { version = "2", optional = true }
rand = { version = "0.9", optional = true }
url = { version = "2", optional = true }
forklaunch-validation = { version = "0.1.0", path = "../forklaunch-validation", optional = true }
forklaunch-ws = { version = "0.1.0", path = "../forklaunch-ws", features = ["transport"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
forklaunch-mcp = { version = "0.1.0", path = "../forklaunch-mcp", features = ["rmcp-server"], optional = true }
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract" }
forklaunch-core = { version = "0.1.0", path = "../forklaunch-core" }
forklaunch-http = { version = "0.1.0", path = "../forklaunch-http" }
forklaunch-auth = { version = "0.1.0", path = "../forklaunch-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "0.1"
opentelemetry = "0.31"
forklaunch-openapi = { version = "0.1.0", path = "../forklaunch-openapi" }

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "request-id", "util"], optional = true }
form_urlencoded = { version = "1", optional = true }
bytes = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }

jsonwebtoken = { version = "9", optional = true }

[dev-dependencies]
forklaunch-validation = { version = "0.1.0", path = "../forklaunch-validation" }
garde = { version = "0.20", features = ["derive"] }
schemars = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[[example]]
name = "docs_parity"
required-features = ["adapter"]

[[example]]
name = "router_origin_parity"
required-features = ["adapter"]

[[example]]
name = "correlation_parity"
required-features = ["adapter"]

[[example]]
name = "cors_parity"
required-features = ["adapter"]
