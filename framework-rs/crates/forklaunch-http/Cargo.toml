[package]
description = "ForkLaunch Rust http APIs and runtime support"
name = "forklaunch-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract", features = ["schema-validation"] }
forklaunch-core = { version = "0.1.0", path = "../forklaunch-core" }

serde = "1"
serde_json = "=1.0.151"
multer = "3"
mime = "0.3"
encoding_rs = "0.8"
percent-encoding = "2"
flate2 = "1"
brotli = "8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
