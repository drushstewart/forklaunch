[package]
description = "ForkLaunch Rust contract APIs and runtime support"
name = "forklaunch-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
zod-regex = ["schema-validation", "forklaunch-common/zod-regex"]
zod-checks = ["schema-validation", "forklaunch-common/zod-checks"]
default = []
zod-uri = ["schema-validation", "dep:ada-url"]
json-schema = ["dep:serde_json", "dep:serde", "dep:percent-encoding"]
schema-validation = ["json-schema", "dep:jsonschema", "dep:regex"]

[dependencies]
ada-url = { version = "=3.2.4", optional = true }
indexmap = "2"
regex = { version = "1", optional = true }
jsonschema = { package = "forklaunch-jsonschema-protocol", version = "0.1.0", path = "../vendor/jsonschema", default-features = false, features = ["idna", "forklaunch-ajv-pointer-decoding", "forklaunch-ajv-ref-siblings", "forklaunch-static-anchor-resolution", "forklaunch-legacy-fragment-ids"], optional = true }
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
serde_json = { version = "=1.0.151", optional = true }
serde = { version = "1", optional = true }
percent-encoding = { version = "2.3", optional = true }

[lints]
workspace = true

[[example]]
name = "uri_schema_parity"
required-features = ["schema-validation"]
