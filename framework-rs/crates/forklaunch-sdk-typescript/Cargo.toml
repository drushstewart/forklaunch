[package]
description = "ForkLaunch Rust sdk typescript APIs and runtime support"
name = "forklaunch-sdk-typescript"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
zod-checks = ["forklaunch-sdk-codegen/zod-checks"]
default = []
zod-uri = ["forklaunch-sdk-codegen/zod-uri"]

[dependencies]
anyhow = "1"
ramhorns = "1.0.1"
serde_json = "=1.0.151"
convert_case = "0.8"
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
forklaunch-sdk-codegen = { version = "0.1.0", path = "../forklaunch-sdk-codegen" }

[dev-dependencies]
forklaunch-openapi = { version = "0.1.0", path = "../forklaunch-openapi" }
forklaunch-sdk-rust = { version = "0.1.0", path = "../forklaunch-sdk-rust" }
forklaunch-asyncapi = { version = "0.1.0", path = "../forklaunch-asyncapi", features = ["import"] }
forklaunch-ws = { version = "0.1.0", path = "../forklaunch-ws" }
serde_json = "=1.0.151"
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract" }

[lints]
workspace = true
