[package]
description = "ForkLaunch Rust auth APIs and runtime support"
name = "forklaunch-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
remote-jwks = ["dep:reqwest", "dep:tokio"]
oidc = ["dep:oauth2", "dep:openidconnect", "dep:reqwest"]

[dependencies]
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract" }
forklaunch-http = { version = "0.1.0", path = "../forklaunch-http" }

serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }

oauth2 = { version = "5.0.0", default-features = false, optional = true }
openidconnect = { version = "4.0.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }

[lints]
workspace = true
