[package]
description = "ForkLaunch Rust asyncapi APIs and runtime support"
name = "forklaunch-asyncapi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
import = ["forklaunch-ws/json-schema"]

[dependencies]
forklaunch-sdk-codegen = { version = "0.1.0", path = "../forklaunch-sdk-codegen" }
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract", features = ["json-schema"] }
forklaunch-ws = { version = "0.1.0", path = "../forklaunch-ws" }

serde_json = "=1.0.151"
percent-encoding = "2.3"

[lints]
workspace = true
