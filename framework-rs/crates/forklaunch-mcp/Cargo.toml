[package]
description = "ForkLaunch Rust mcp APIs and runtime support"
name = "forklaunch-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
zod-uri = ["forklaunch-contract/zod-uri"]
rmcp-server = ["dep:rmcp", "dep:axum", "dep:tokio", "dep:tower", "dep:percent-encoding", "dep:form_urlencoded", "dep:base64", "dep:serde", "dep:forklaunch-validation"]

[dependencies]
forklaunch-common = { version = "0.1.0", path = "../forklaunch-common" }
forklaunch-contract = { version = "0.1.0", path = "../forklaunch-contract", features = ["json-schema"] }

rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
percent-encoding = { version = "2", optional = true }
form_urlencoded = { version = "1", optional = true }

base64 = { version = "0.22", optional = true }

serde = { version = "1", optional = true }
forklaunch-validation = { version = "0.1.0", path = "../forklaunch-validation", optional = true }

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
garde = { version = "0.20", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
