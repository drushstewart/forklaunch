[package]
name = "forklaunch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
otlp = ["dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing", "dep:tracing-subscriber", "dep:tokio"]
postgres = ["dep:sqlx"]
encryption = ["dep:aes-gcm", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:base64", "dep:rand_core", "dep:zeroize"]

[dependencies]
forklaunch-common = { path = "../forklaunch-common" }
forklaunch-contract = { path = "../forklaunch-contract" }

opentelemetry = { version = "0.31", features = ["metrics", "trace"] }
tracing = "0.1"
opentelemetry_sdk = { version = "0.31", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "http-json", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
opentelemetry-appender-tracing = { version = "0.31", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"], optional = true }

aes-gcm = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
opentelemetry_sdk = { version = "0.31", features = ["testing"] }

[lints]
workspace = true

[[example]]
name = "field_encryption_parity"
required-features = ["encryption"]

[[example]]
name = "otlp_runtime"
required-features = ["otlp"]
