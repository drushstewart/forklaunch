[package]
name = "forklaunch-ws"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
json-schema = ["dep:jsonschema", "dep:regex"]
transport = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
validation = ["dep:forklaunch-validation"]

[dependencies]
regex = { version = "1", optional = true }
jsonschema = { package = "forklaunch-jsonschema-protocol", version = "0.1.0", path = "../vendor/jsonschema", default-features = false, features = ["idna", "forklaunch-ajv-pointer-decoding", "forklaunch-ajv-ref-siblings", "forklaunch-static-anchor-resolution", "forklaunch-legacy-fragment-ids"], optional = true }
forklaunch-common = { path = "../forklaunch-common" }
forklaunch-contract = { path = "../forklaunch-contract" }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
forklaunch-validation = { path = "../forklaunch-validation", optional = true }
tokio = { version = "1", features = ["net", "time"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
garde = { version = "0.20", features = ["derive"] }
schemars = "0.8"

[[example]]
name = "websocket_runtime"
required-features = ["transport"]

[lints]
workspace = true
