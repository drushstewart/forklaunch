[workspace]
resolver = "3"
exclude = ["crates/vendor/jsonschema", "crates/vendor/referencing", "crates/vendor/serde_json", "crates/vendor/regress"]
members = [
    "crates/universal-sdk","crates/common", "crates/core", "crates/core-macros", "crates/validator", "crates/axum", "crates/ws", "crates/redis", "crates/s3", "crates/testing"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["Forklift Technologies, Inc. <engineering@forklaunch.com>"]
repository = "https://github.com/forklaunch/forklaunch-js"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
serde_json = { path = "crates/vendor/serde_json" }
