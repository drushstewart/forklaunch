<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldnotes</title>
  </head>
  <body>
    <main id="app">
      <header>
        <span>FIELDNOTES / LOCAL REVIEW</span>
        <h1>A little room for your thoughts.</h1>
        <p>
          Private notes, shared ideas, and a live view of what happens next.
        </p>
      </header>
      <form id="login">
        <label
          >Email<input
            name="email"
            type="email"
            value="alice@example.test"
            required /></label
        ><label
          >Password<input name="password" type="password" required /></label
        ><button>Sign in</button>
      </form>
      <section id="workspace" hidden>
        <nav>
          <label>Workspace<select id="spaces"></select></label
          ><button id="new">New note</button
          ><button id="logout">Sign out</button>
        </nav>
        <div class="layout">
          <aside>
            <h2>Your notes</h2>
            <div id="notes"></div>
          </aside>
          <article>
            <form id="editor">
              <label>Title<input id="title" required maxlength="200" /></label
              ><label
                >Note<textarea id="body" rows="12" required></textarea>
              </label>
              <div class="actions">
                <button>Save note</button
                ><button type="button" id="insights">Generate insight</button
                ><button type="button" id="archive">Archive</button>
              </div>
            </form>
            <section aria-labelledby="insight-heading">
              <h2 id="insight-heading">Note insight</h2>
              <p id="insight">Save a note to generate an insight.</p>
              <small id="insight-count"></small>
            </section>
            <section>
              <h2>Attachments</h2>
              <form id="upload">
                <label
                  >File (up to 1 MiB)<input
                    id="file"
                    type="file"
                    required /></label
                ><button>Upload encrypted attachment</button>
              </form>
              <div id="attachments"></div>
            </section>
            <small id="revision"></small>
          </article>
          <aside>
            <h2>Live activity</h2>
            <p id="connection">Connecting…</p>
            <ol id="activity"></ol>
          </aside>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
