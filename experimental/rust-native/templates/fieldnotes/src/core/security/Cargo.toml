[package]
name = "fieldnotes-security"
version = "0.1.0"
edition = "2024"
[dependencies]
forklaunch-core = {path = "../../../vendor/framework/crates/core", features = ["auth", "session-client", "encryption"] }
worker = { package = "forklaunch-worker-interface", path = "../../../.forklaunch/blueprint-rs/crates/interfaces/worker-interface", features = ["encrypted"]}
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error conversion remains an application compatibility boundary for the notes repository.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[lib]
path = "lib.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
