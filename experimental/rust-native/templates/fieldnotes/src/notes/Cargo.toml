[package]
name = "fieldnotes-notes"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
framework_core = { package = "forklaunch-core", path = "../../vendor/framework/crates/core", features = ["rmcp-server", "openapi", "encryption", "otlp", "postgres09", "mappers"] }
worker = { package = "forklaunch-worker-interface", path = "../../.forklaunch/blueprint-rs/crates/interfaces/worker-interface", features = ["encrypted", "telemetry"]}
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1"
s3 = { package = "forklaunch-infrastructure-s3", path = "../../vendor/framework/crates/s3", features = ["aws-sdk"] }
redis-cache = { package = "forklaunch-infrastructure-redis", path = "../../vendor/framework/crates/redis", features = ["redis-client"] }
framework = { package = "forklaunch-axum", path = "../../vendor/framework/crates/axum", default-features = false, features = ["native-streams", "native-server"] }
fieldnotes-contracts = { path = "domain" }
fieldnotes-security = { path = "../core/security" }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"

[build-dependencies]
uuid = "1"
chrono = "0.4"
framework_core = { package = "forklaunch-core", path = "../../vendor/framework/crates/core", features = ["encryption", "build"] }

fieldnotes-contracts = { path = "domain" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lib]
path = "lib.rs"

[[bin]]
name = "fieldnotes-notes"
path = "main.rs"
