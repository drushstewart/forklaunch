[package]
name = "fieldnotes-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
worker = { package = "forklaunch-worker-interface", path = "../../../.forklaunch/blueprint-rs/crates/interfaces/worker-interface", features = ["encrypted", "schema"]}
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
ws = { package = "forklaunch-ws", path = "../../../vendor/framework/crates/ws", features = ["json-schema", "typed-schema"] }
framework_core = { package = "forklaunch-core", path = "../../../vendor/framework/crates/core", features = ["typed-schema"] }

[lib]
path = "../sdk.rs"
