[package]
name = "fieldnotes-insights"
version = "0.1.0"
edition = "2024"

[dependencies]
framework_core = { package = "forklaunch-core", path = "../../vendor/framework/crates/core", features = ["otlp", "postgres09"] }
chrono = { version = "0.4", features = ["clock"] }
fieldnotes-contracts = { path = "../notes/domain" }
worker = { package = "forklaunch-worker-interface", path = "../../.forklaunch/blueprint-rs/crates/interfaces/worker-interface", features = ["apalis", "telemetry", "native", "encrypted"] }
s3 = { package = "forklaunch-infrastructure-s3", path = "../../vendor/framework/crates/s3", features = ["aws-sdk"] }
fieldnotes-client = { path = "../client-sdk/rust" }
apalis = "=1.0.0"
apalis-core = "=1.0.0"
apalis-postgres = "=1.0.0"
fieldnotes-security = { path = "../core/security" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[lib]
path = "lib.rs"

[[bin]]
name = "fieldnotes-insights"
path = "main.rs"

[[test]]
name = "postgres"
path = "__test__/postgres.rs"

[build-dependencies]
fieldnotes-contracts = { path = "../notes/domain" }
uuid = "1"
framework_core = { package = "forklaunch-core", path = "../../vendor/framework/crates/core", features = ["encryption", "typed-schema", "build"] }
