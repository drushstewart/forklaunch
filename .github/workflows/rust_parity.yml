name: Rust Framework Parity

on:
  pull_request:
    paths:
      - 'framework-rs/**'
      - 'blueprint-rs/**'
      - 'framework/core/src/persistence/fieldEncryptor.ts'
      - 'cli/tests/rust_field_encryption_parity.mjs'
      - 'cli/tests/rust_asyncapi_parity.mjs'
      - 'cli/tests/rust_native_sdk_parity.mjs'
      - 'cli/tests/rust_otlp_runtime.mjs'
      - 'cli/tests/rust_cac_provider_parity.mjs'
      - 'cli/tests/rust_request_hmac_parity.mjs'
      - '.github/workflows/rust_parity.yml'
  push:
    branches: [main, rohin/rust-framework]
    paths:
      - 'framework-rs/**'
      - 'blueprint-rs/**'
      - 'framework/core/src/persistence/fieldEncryptor.ts'
      - 'cli/tests/rust_field_encryption_parity.mjs'
      - 'cli/tests/rust_asyncapi_parity.mjs'
      - 'cli/tests/rust_native_sdk_parity.mjs'
      - 'cli/tests/rust_otlp_runtime.mjs'
      - 'cli/tests/rust_cac_provider_parity.mjs'
      - 'cli/tests/rust_request_hmac_parity.mjs'
      - '.github/workflows/rust_parity.yml'

jobs:
  framework:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
      FORKLAUNCH_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: framework-rs
      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name forklaunch-rust-s3 --memory 512m \
            --tmpfs /data:rw,size=128m,mode=1777 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=parity-test-access -e MINIO_ROOT_PASSWORD=parity-test-secret-only \
            cgr.dev/chainguard/minio@sha256:6476f81b9739912fa9f50ceae2bb049a30336527cccd24beccfbeb4145f8f696 \
            server /data --address :9000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs forklaunch-rust-s3
          exit 1
      - run: cargo fmt --manifest-path framework-rs/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path framework-rs/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path framework-rs/Cargo.toml --workspace --all-features
      - run: cargo test --manifest-path framework-rs/Cargo.toml -p forklaunch-infrastructure-redis --all-features redis_backend -- --ignored
      - run: cargo test --manifest-path framework-rs/Cargo.toml -p forklaunch-infrastructure-s3 --all-features s3_backend -- --ignored
      - name: Remove isolated S3 storage
        if: always()
        run: docker rm -f forklaunch-rust-s3 || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 @asyncapi/parser@3.6.3 ajv@8.20.0
      - run: node cli/tests/rust_otlp_runtime.mjs
      - run: node cli/tests/rust_asyncapi_parity.mjs
        env:
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
      - run: node cli/tests/rust_native_sdk_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_request_hmac_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_field_encryption_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc

  blueprint:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: parity-test-only
          POSTGRES_DB: parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
      FORKLAUNCH_TEST_POSTGRES_URL: postgres://postgres:parity-test-only@127.0.0.1:5432/parity
      FORKLAUNCH_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blueprint-rs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3
      - run: node cli/tests/rust_cac_provider_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - name: Start isolated Kafka-compatible broker
        run: |
          docker run --detach --name forklaunch-rust-kafka-ci --memory 1536m --cpus 2 \
            --publish 127.0.0.1:9092:9092 --tmpfs /var/lib/redpanda/data:rw,size=512m,mode=1777 \
            redpandadata/redpanda@sha256:218469e5d088757bb2c3ff4c5e272f7eebdc4e94c933e6e15aff10b845cbcd07 \
            redpanda start --overprovisioned --smp 1 --memory 768M --reserve-memory 0M \
            --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:9092
          for attempt in $(seq 1 60); do
            if docker exec forklaunch-rust-kafka-ci rpk cluster health | grep -q 'Healthy:.*true'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: cargo fmt --manifest-path blueprint-rs/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path blueprint-rs/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path blueprint-rs/Cargo.toml --workspace --all-features
      - run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-iam-base --all-features postgres_backend -- --ignored
      - run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-blueprint-sample-service --all-features postgres_iam_http -- --ignored
      - run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-worker-database --all-features postgres_worker -- --ignored
      - run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-worker-redis --all-features redis_worker -- --ignored
      - run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-worker-kafka --all-features --test kafka_worker -- --ignored
      - name: Stop isolated Kafka-compatible broker
        if: always()
        run: docker rm -f forklaunch-rust-kafka-ci || true
