  blueprint:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: parity-test-only
          POSTGRES_DB: parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
