  blueprint:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: parity-test-only
          POSTGRES_DB: parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
      TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
      FORKLAUNCH_TEST_BETTER_AUTH_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
      FORKLAUNCH_TEST_EXPRESS_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
      FORKLAUNCH_TEST_SCALAR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
      FORKLAUNCH_TEST_ORM_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
      FORKLAUNCH_TEST_POSTGRES_URL: postgres://postgres:parity-test-only@127.0.0.1:5432/parity
      FORKLAUNCH_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blueprint-rs
      - uses: actions/setup-node@v4
