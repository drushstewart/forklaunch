      - name: Start isolated Kafka-compatible broker
        run: |
          docker run --detach --name forklaunch-rust-kafka-ci --memory 1536m --cpus 2 \
            --publish 127.0.0.1:9092:9092 --tmpfs /var/lib/redpanda/data:rw,size=512m,mode=1777 \
            redpandadata/redpanda@sha256:218469e5d088757bb2c3ff4c5e272f7eebdc4e94c933e6e15aff10b845cbcd07 \
            redpanda start --overprovisioned --smp 1 --memory 768M --reserve-memory 0M \
            --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:9092
          for attempt in $(seq 1 60); do
            if docker exec forklaunch-rust-kafka-ci rpk cluster health | grep -q 'Healthy:.*true'; then exit 0; fi
            sleep 1
          done
          exit 1
