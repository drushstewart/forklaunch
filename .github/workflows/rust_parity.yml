jobs:
  framework:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
      FORKLAUNCH_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: framework-rs
      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name forklaunch-rust-s3 --memory 512m \
            --tmpfs /data:rw,size=128m,mode=1777 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=parity-test-access -e MINIO_ROOT_PASSWORD=parity-test-secret-only \
            cgr.dev/chainguard/minio@sha256:6476f81b9739912fa9f50ceae2bb049a30336527cccd24beccfbeb4145f8f696 \
            server /data --address :9000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs forklaunch-rust-s3
          exit 1
      - run: cargo fmt --manifest-path framework-rs/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path framework-rs/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --manifest-path framework-rs/Cargo.toml --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Framework tests and reviewed OpenAPI / SDK snapshots
        run: cargo test --manifest-path framework-rs/Cargo.toml --workspace --all-features
      - run: cargo test --manifest-path framework-rs/crates/vendor/serde_json/Cargo.toml --locked --target-dir framework-rs/target
      - run: cargo test --manifest-path framework-rs/crates/vendor/serde_json/Cargo.toml --locked --all-features --target-dir framework-rs/target
      - run: cargo check --manifest-path framework-rs/crates/vendor/serde_json/Cargo.toml --locked --no-default-features --features alloc,arbitrary_precision,raw_value --target-dir framework-rs/target
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/referencing/Cargo.toml --locked --lib
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/referencing/Cargo.toml --locked --lib --features forklaunch-ajv-pointer-decoding
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/jsonschema/Cargo.toml --locked --lib --no-default-features --features idna -- --skip validator::tests::validate_ref
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/referencing/Cargo.toml --locked --lib --features 'forklaunch-static-anchor-resolution forklaunch-ajv-ref-siblings forklaunch-legacy-fragment-ids'
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/jsonschema/Cargo.toml --locked --lib --no-default-features --features 'idna forklaunch-static-anchor-resolution' -- --skip validator::tests::validate_ref
      - name: AJV sibling compatibility profile (default-profile assertions run above)
        run: >-
          CARGO_TARGET_DIR=framework-rs/target cargo test
          --manifest-path framework-rs/crates/vendor/jsonschema/Cargo.toml --locked --lib
          --no-default-features --features 'idna forklaunch-ajv-ref-siblings forklaunch-static-anchor-resolution forklaunch-legacy-fragment-ids' --
          --skip validator::tests::validate_ref
          --skip evaluation::tests::ref_siblings_produce_no_annotations
          --skip keywords::discriminator::tests::draft7_ignores_pins_beside_a_reference
          --skip keywords::discriminator::tests::unpinned_value_is_not_dispatched::test_case_3_const_beside_a_reference_in_draft_7
          --skip tests::absolute_keyword_location_in_nested_resource::test_case_10_draft_7_id_beside_ref_names_no_resource
          --skip tests::custom_meta_schema_preserves_underlying_draft_behavior
      - run: cargo test --manifest-path framework-rs/Cargo.toml -p forklaunch-infrastructure-redis --all-features redis_backend -- --ignored
      - run: cargo test --manifest-path framework-rs/Cargo.toml -p forklaunch-infrastructure-s3 --all-features s3_backend -- --ignored
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 @asyncapi/parser@3.6.3 ajv@8.20.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1 @types/ws@8.18.1 @types/node@26.6.5 cross-fetch@4.1.0 zod@4.6.5 ts-deepmerge@8.0.0 ws@8.22.0 @tanstack/react-query@5.104.2 @tanstack/query-core@5.104.2 react@19.2.4 @types/react@19.3.0
      - run: node cli/tests/rust_common_naming.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
      - name: Smoke all six native runtime benchmarks
        run: node cli/tests/rust_benchmarks.mjs --debug --require-infra
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_BENCH_ITERATIONS: '20'
          FORKLAUNCH_BENCH_WARMUP: '5'
          FORKLAUNCH_BENCH_REDIS_URL: redis://127.0.0.1:6379/
          FORKLAUNCH_BENCH_S3: '1'
          FORKLAUNCH_BENCH_CREATE_BUCKET: '1'
          S3_URL: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: forklaunch-bench
          S3_ACCESS_KEY_ID: parity-test-access
          S3_SECRET_ACCESS_KEY: parity-test-secret-only
          FORKLAUNCH_BENCH_OUTPUT: ${{ runner.temp }}/rust-benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-benchmark-smoke
          path: ${{ runner.temp }}/rust-benchmark-smoke.json
      - name: Remove isolated S3 storage
        if: always()
        run: docker rm -f forklaunch-rust-s3 || true
      - run: node cli/tests/rust_redis_queue_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_retention_hooks_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_json_cache_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_json_object_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_s3_environment_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_otlp_runtime.mjs
      - run: node cli/tests/rust_asyncapi_parity.mjs
        env:
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
      - run: node cli/tests/rust_mcp_body_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: node cli/tests/rust_query_transport_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
      - run: |
          mkdir -p "$RUNNER_TEMP/fl-canonical-http"
          cp cli/tests/fixtures/canonical-iam/package.json "$RUNNER_TEMP/fl-canonical-http/package.json"
