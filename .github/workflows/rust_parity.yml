  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo generate-lockfile --manifest-path cli/Cargo.toml
      - run: python3 -m unittest discover -s scripts -p test_rust_ecs_smoke_plan.py -v
      - run: python3 cli/tests/rust_security_audit_test.py
      - run: python3 cli/tests/rust_security_audit.py
        env:
          FORKLAUNCH_SECURITY_REPORT: ${{ runner.temp }}/rust-security-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-security-review
          path: ${{ runner.temp }}/rust-security-review.json
