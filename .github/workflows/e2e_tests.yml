name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "framework-rs/**"
      - "blueprint-rs/**"
      - "blueprint/client-sdk/**"
      - "blueprint/iam-better-auth/**"
  pull_request:
    paths:
      - "cli/**"
      - "framework-rs/**"
      - "blueprint-rs/**"
      - "blueprint/client-sdk/**"
      - "blueprint/iam-better-auth/**"

permissions:
  contents: read

jobs:
  # The CLI is compiled once and shared. Previously all six test jobs ran
  # `cargo build --release` themselves — around four minutes each, roughly
  # twenty-five minutes of duplicated compute per run — and every one of the
  # 207 `cargo run --release` calls inside the scripts re-checked that build.
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Replaces a hand-rolled actions/cache whose path was `target` while
      # cargo builds into `cli/target`, so build artifacts were never cached
      # and every job paid a full rebuild.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build CLI
        working-directory: ./cli
        # Not --locked: cli/Cargo.lock is gitignored, so there is no committed
        # lock file to honour. That is also why the previous cache key,
        # hashFiles('**/Cargo.lock'), hashed nothing.
        run: cargo build --release

      - name: Verify packaged CLI installation and Rust generation
        run: bash cli/tests/rust_packaged_install.sh

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: forklaunch-cli
          path: cli/target/release/forklaunch
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build-cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            name: "Init Tests (heavy modules)"
            scripts: "change_router_add_mappers.sh dryrun.sh existing_docker_compose.sh init_module_src_path.sh release_non_tty.sh sync_service_subcommand.sh"
          - group: 2
            name: "Init Tests (components)"
            scripts: "change_library.sh delete_worker.sh environment_validate.sh init_application.sh init_compile.sh init_messaging_twilio.sh sync_worker_subcommand.sh"
          - group: 3
            name: "Sync Tests"
            scripts: "change_sdk_mode.sh change_worker.sh delete_library.sh delete_service.sh depcheck.sh init_service_mappers.sh precheck_version_mismatch_decline_fails.sh sync_add_remove_flow.sh"
          - group: 4
            name: "Change Tests"
            scripts: "change_router.sh change_service.sh change_service_worker_migration.sh eject.sh init_worker.sh precheck_version_match_allows_run.sh sync_application_remove.sh"
          - group: 5
            name: "Delete Tests"
            scripts: "change_application.sh init_application_custom_path.sh init_module.sh init_service.sh init_worker_mappers.sh init_worker_workspace_and_typecheck.sh sync_application_add.sh"
          - group: 6
            name: "Other Tests"
            scripts: "delete_router.sh environment_sync.sh init_billing_stripe.sh init_cac.sh init_iam_better_auth.sh init_library.sh init_relay.sh init_relay_drift.sh init_router.sh sync_library_subcommand.sh"

          - group: 7
            name: "Rust Backend Generation"
            scripts: "init_rust_projects.sh rust_init_commands.sh rust_change_commands.sh rust_sync_commands.sh rust_delete_commands.sh rust_sdk_openapi_commands.sh rust_http_runtime.sh rust_sse_runtime.sh rust_recursive_sdk_runtime.sh rust_ws_cli_runtime.sh rust_asyncapi_import_runtime.sh rust_sdk_presence_runtime.sh rust_http_methods_runtime.sh rust_package_sources.sh rust_release_runtime.sh rust_generated_release_runtime.sh rust_mixed_sdk_runtime.sh rust_mixed_lifecycle.sh rust_mixed_attach.sh rust_mixed_sync.sh rust_typescript_attach.sh rust_mixed_compliance.sh rust_sdk_workspace.sh rust_socket_workspace.sh rust_mixed_dev.sh rust_storefront_lifecycle.sh rust_iam_runtime.sh rust_better_auth_runtime.sh rust_cac_runtime.sh rust_messaging_runtime.sh rust_billing_runtime.sh rust_ecommerce_runtime.sh rust_ecommerce_container_runtime.sh rust_worker_runtime.sh rust_redis_worker_runtime.sh rust_bullmq_worker_runtime.sh rust_kafka_worker_runtime.sh rust_kafka_container_runtime.sh rust_generated_otlp_runtime.sh rust_container_runtime.sh"

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust for generated backend checks
        if: matrix.group == 7
        uses: dtolnay/rust-toolchain@stable

      - name: Reuse Cargo artifacts across generated Rust workspaces
        if: matrix.group == 7
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/forklaunch-generated-target" >> "$GITHUB_ENV"

      - name: Install TypeScript compiler for SDK checks
        if: matrix.group == 7
        run: npm install --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 @types/node@22 @types/ws@8.18.1 ws@8.22.0 ajv@8.20.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1 @asyncapi/parser@3.6.3 stripe@22.6.2 bullmq@6.3.10 ioredis@6.0.0 zod@4.6.5 ts-deepmerge@8.0.0 cross-fetch@4.1.0 better-auth@1.7.6

      - name: Configure pinned worker and auth client fixtures
        if: matrix.group == 7
        run: |
          echo "BULLMQ_SDK_PATH=$RUNNER_TEMP/fl-rust-ts/node_modules/bullmq" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_BETTER_AUTH_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # The scaffolded applications install the same dependency trees over and
      # over. Nothing cached them before, so every install refetched everything
      # from the registry — the single largest cost in these jobs.
      # Pinned rather than read back from `pnpm store path`, which reported a
      # directory that pnpm had not created yet — the save step then refused it
      # with "Path(s) specified in the action for caching do(es) not exist".
      # Creating it up front also guarantees every generated application shares
      # one store instead of each resolving its own.
      - name: Configure pnpm store
        run: |
          mkdir -p ~/.pnpm-store
          pnpm config set store-dir ~/.pnpm-store --global

      # Split restore/save rather than plain actions/cache, which skips its
      # post-save step whenever the job fails. That is the wrong way round
      # here: a red run still populates the store, and it is precisely while
      # CI is failing that the next attempt most wants a warm cache.
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: forklaunch-cli
          path: cli-bin

      - name: Create .forklaunch directory
        run: mkdir -p ~/.forklaunch

      - name: Create token file
        run: |
          cat > ~/.forklaunch/token << 'EOF'
          access_token = "mock_access_token_for_e2e_tests"
          refresh_token = "mock_refresh_token_for_e2e_tests"
          expires_at = 9999999999
          EOF

      - name: Run ${{ matrix.name }}
        working-directory: ./cli/tests
        env:
          # Scripts fall back to `cargo run --release` when this is unset, so
          # they still work unchanged for anyone running them locally.
          FORKLAUNCH_CLI: ${{ github.workspace }}/cli-bin/forklaunch
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
          FORKLAUNCH_TEST_WS_SDK_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
          # With a warm store there is no reason to go to the network first.
          NPM_CONFIG_PREFER_OFFLINE: "true"
        run: |
          set -e
          chmod +x "$FORKLAUNCH_CLI"
          test_count=0
          for test_script in ${{ matrix.scripts }}; do
            if [ -f "$test_script" ]; then
              echo "[INFO] Running test: $test_script"
              test_count=$((test_count + 1))
              if ! ./"$test_script"; then
                echo "[ERROR] Test failed: $test_script"
                exit 1
              fi
              echo "[OK] Test passed: $test_script"
            else
              echo "[ERROR] Missing test script: $test_script"
              exit 1
            fi
          done
          echo "[SUCCESS] All $test_count tests passed in group: ${{ matrix.name }}"

      # A content-addressed store, so saving a partially populated one is safe:
      # entries are immutable and keyed by hash, and the next run reuses
      # whatever made it in.
      - name: Save pnpm store
        if: always() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}
