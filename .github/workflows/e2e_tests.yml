name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "framework-rs/**"
      - "blueprint-rs/**"
  pull_request:
    paths:
      - "cli/**"
      - "framework-rs/**"
      - "blueprint-rs/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7]
        include:
          - group: 1
            name: "Init Tests (heavy modules)"
            pattern: "init_@(application|billing|iam)*.sh"
          - group: 2
            name: "Init Tests (components)"
            pattern: "init_@(compile|library|module|router|service|worker)*.sh"
          - group: 3
            name: "Sync Tests"
            pattern: "sync*.sh"
          - group: 4
            name: "Change Tests"
            pattern: "change*.sh"
          - group: 5
            name: "Delete Tests"
            pattern: "delete*.sh"
          - group: 6
            name: "Other Tests"
            pattern: "!(init*|sync*|change*|delete*|rust*).sh"
          - group: 7
            name: "Rust Backend Generation"
            pattern: "@(init_rust_projects|rust*).sh"

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install TypeScript compiler for SDK checks
        if: matrix.group == 7
        run: npm install --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build project
        working-directory: ./cli
        run: cargo build --release

      - name: Create .forklaunch directory
        run: mkdir -p ~/.forklaunch

      - name: Create token file
        run: |
          cat > ~/.forklaunch/token << 'EOF'
          access_token = "mock_access_token_for_e2e_tests"
          refresh_token = "mock_refresh_token_for_e2e_tests"
          expires_at = 9999999999
          EOF

      - name: Run ${{ matrix.name }}
        working-directory: ./cli/tests
        env:
          FORKLAUNCH_TEST_CLI: ${{ github.workspace }}/cli/target/release/forklaunch
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        run: |
          set -e
          shopt -s extglob nullglob
          test_count=0
          failed_test=""
          for test_script in ${{ matrix.pattern }}; do
            if [ -f "$test_script" ]; then
              echo "[INFO] Running test: $test_script"
              test_count=$((test_count + 1))
              if ! ./"$test_script"; then
                failed_test="$test_script"
                echo "[ERROR] Test failed: $test_script"
                exit 1
              fi
              echo "[OK] Test passed: $test_script"
            fi
          done
          echo "[SUCCESS] All $test_count tests passed in group: ${{ matrix.name }}"
