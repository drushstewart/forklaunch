[package]
publish = false
name = "forklaunch-blueprint-sample-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
oidc-sessions = ["browser-sessions", "forklaunch-iam-axum/oidc-sessions"]
browser-sessions = ["postgres", "forklaunch-iam-axum/browser-sessions", "forklaunch-iam-base/browser-sessions", "dep:tower-sessions"]
postgres = ["forklaunch-iam-base/postgres", "dep:sqlx", "dep:tokio"]

[[example]]
name = "postgres_iam"
required-features = ["postgres"]

[dependencies]
tower-sessions = { version = "0.15", optional = true }
forklaunch-blueprint-core = { version = "0.1.0", path = "../forklaunch-blueprint-core" }
forklaunch-iam-interface = { version = "0.1.0", path = "../interfaces/forklaunch-iam-interface" }
forklaunch-iam-base = { version = "0.1.0", path = "../implementations/iam/forklaunch-iam-base" }
forklaunch-axum = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-axum" }
forklaunch-core = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-core" }
forklaunch-iam-axum = { version = "0.1.0", path = "../implementations/iam/forklaunch-iam-axum" }
axum = "0.8"

forklaunch-auth = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-auth" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }

[dev-dependencies]
form_urlencoded = "1"
forklaunch-validation = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-validation" }
jsonwebtoken = "9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
