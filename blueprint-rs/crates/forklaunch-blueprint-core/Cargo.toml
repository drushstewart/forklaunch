[package]
description = "ForkLaunch Rust blueprint core APIs and runtime support"
name = "forklaunch-blueprint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
instance-gateway = ["provider-http", "dep:forklaunch-auth", "dep:chrono", "dep:uuid", "dep:zeroize"]
stripe-webhook = ["dep:hmac", "dep:sha2", "dep:zeroize"]
provider-http = ["dep:reqwest", "dep:url"]

[dependencies]
forklaunch-contract = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-contract" }
forklaunch-http = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-http" }

serde = { version = "1", features = ["derive"] }
schemars = "0.8"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
serde_json = "1"
url = { version = "2", optional = true }

hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }

forklaunch-auth = { version = "0.1.0", path = "../../../framework-rs/crates/forklaunch-auth", optional = true }
chrono = { version = "0.4", features = ["clock"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[lints]
workspace = true
