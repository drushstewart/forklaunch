[package]
publish = false
description = "ForkLaunch Rust cac axum APIs and runtime support"
name = "forklaunch-cac-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-cac-interface = { version = "=0.1.1", path = "../../../interfaces/cac-interface" }
forklaunch-axum = { version = "=0.1.3", path = "../../../../../framework-rs/crates/axum", features = ["remote-jwks"] }
forklaunch-core = { version = "=0.1.3", path = "../../../../../framework-rs/crates/core", features = ["auth", "remote-jwks", "http", "domain"] }
axum = "0.8"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
serde_json = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
forklaunch-cac-base = { version = "=0.1.1", path = "../cac-base" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
