[package]
name = "forklaunch-worker-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
redis-client = ["dep:redis", "dep:serde", "dep:serde_json", "dep:tokio", "dep:uuid", "dep:forklaunch-core", "dep:futures-util"]

[dependencies]
forklaunch-blueprint-core = { path = "../../../forklaunch-blueprint-core" }
forklaunch-worker-interface = { path = "../../../interfaces/forklaunch-worker-interface" }

forklaunch-core = { path = "../../../../../framework-rs/crates/forklaunch-core", optional = true }
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager", "script"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["time", "sync", "rt"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
forklaunch-worker-database = { path = "../forklaunch-worker-database", features = ["runtime", "http-control"] }

[lints]
workspace = true

[[example]]
name = "tenant_scope_parity"
required-features = ["redis-client"]
