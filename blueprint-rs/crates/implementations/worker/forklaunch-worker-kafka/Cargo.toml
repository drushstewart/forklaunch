[package]
description = "ForkLaunch Rust worker kafka APIs and runtime support"
name = "forklaunch-worker-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
kafka-client = ["dep:rdkafka", "dep:tokio", "dep:serde", "dep:serde_json", "dep:sha2", "dep:forklaunch-core", "dep:forklaunch-worker-database"]

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-worker-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-worker-interface" }

rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build", "ssl-vendored"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core", optional = true }
forklaunch-worker-database = { version = "0.1.0", path = "../forklaunch-worker-database", features = ["runtime"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
