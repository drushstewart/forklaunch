[package]
publish = false
description = "ForkLaunch Rust ecommerce axum APIs and runtime support"
name = "forklaunch-ecommerce-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-ecommerce-interface = { version = "=0.2.0", path = "../../../interfaces/ecommerce-interface" }
forklaunch-ecommerce-base = { version = "=0.2.0", path = "../ecommerce-base", features = ["postgres", "worker"] }
forklaunch-ecommerce-stripe = { version = "=0.2.0", path = "../ecommerce-stripe" }
forklaunch-ecommerce-paypal = { version = "=0.2.0", path = "../ecommerce-paypal" }
forklaunch-worker-database = { version = "=0.2.0", path = "../../worker/worker-database", features = ["postgres"] }
forklaunch-axum = { version = "=0.2.0", path = "../../../../../framework-rs/crates/axum", features = ["remote-jwks", "mcp"] }
forklaunch-core = { version = "=0.2.0", path = "../../../../../framework-rs/crates/core", features = ["auth", "remote-jwks", "http", "domain"] }
tokio = { version = "1", features = ["sync"] }
axum = "0.8"
serde = "1"
serde_json = "1"
tracing = "0.1"
form_urlencoded = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
forklaunch-worker-interface = { version = "=0.2.0", path = "../../../interfaces/worker-interface" }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[lints]
workspace = true
