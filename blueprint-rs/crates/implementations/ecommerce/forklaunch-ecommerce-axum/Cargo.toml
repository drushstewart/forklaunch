[package]
name = "forklaunch-ecommerce-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-blueprint-core = { path = "../../../forklaunch-blueprint-core" }
forklaunch-ecommerce-interface = { path = "../../../interfaces/forklaunch-ecommerce-interface" }
forklaunch-ecommerce-base = { path = "../forklaunch-ecommerce-base", features = ["postgres", "worker"] }
forklaunch-ecommerce-stripe = { path = "../forklaunch-ecommerce-stripe" }
forklaunch-ecommerce-paypal = { path = "../forklaunch-ecommerce-paypal" }
forklaunch-worker-database = { path = "../../worker/forklaunch-worker-database", features = ["postgres"] }
forklaunch-axum = { path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["remote-jwks", "mcp"] }
forklaunch-core = { path = "../../../../../framework-rs/crates/forklaunch-core" }
tokio = { version = "1", features = ["sync"] }
axum = "0.8"
serde = "1"
serde_json = "1"
tracing = "0.1"
form_urlencoded = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
forklaunch-auth = { path = "../../../../../framework-rs/crates/forklaunch-auth", features = ["remote-jwks"] }
forklaunch-worker-interface = { path = "../../../interfaces/forklaunch-worker-interface" }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[lints]
workspace = true
