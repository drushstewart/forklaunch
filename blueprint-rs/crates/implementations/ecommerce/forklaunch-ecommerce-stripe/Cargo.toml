[package]
description = "ForkLaunch Rust ecommerce stripe APIs and runtime support"
name = "forklaunch-ecommerce-stripe"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["forklaunch-ecommerce-base/postgres"]

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core", features = ["provider-http", "stripe-webhook"] }
forklaunch-ecommerce-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-ecommerce-interface" }
forklaunch-ecommerce-base = { version = "0.1.0", path = "../forklaunch-ecommerce-base" }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core", features = ["postgres", "encryption"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = "0.8"

[lints]
workspace = true
