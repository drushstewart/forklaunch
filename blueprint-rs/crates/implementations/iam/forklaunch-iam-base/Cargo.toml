[package]
description = "ForkLaunch Rust iam base APIs and runtime support"
name = "forklaunch-iam-base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "forklaunch-core/postgres", "forklaunch-core/encryption", "dep:sha2", "tokio/rt-multi-thread", "tokio/macros"]
jwt-sessions = ["postgres", "dep:jsonwebtoken"]

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-iam-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-iam-interface" }

argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }

forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"], optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = { version = "0.10", optional = true }
jsonwebtoken = { version = "9", optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
