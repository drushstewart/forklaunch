[package]
name = "forklaunch-iam-base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "dep:forklaunch-core", "dep:serde_json", "dep:tokio", "dep:sha2"]

[dependencies]
forklaunch-blueprint-core = { path = "../../../forklaunch-blueprint-core" }
forklaunch-iam-interface = { path = "../../../interfaces/forklaunch-iam-interface" }

argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }

forklaunch-core = { path = "../../../../../framework-rs/crates/forklaunch-core", features = ["postgres"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
sha2 = { version = "0.10", optional = true }

[lints]
workspace = true
