[package]
name = "forklaunch-iam-better-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
http = ["dep:axum", "dep:tower-http"]
postgres = ["dep:sqlx", "dep:forklaunch-core"]

[dependencies]
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
forklaunch-blueprint-core = { path = "../../../forklaunch-blueprint-core" }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
zeroize = "1"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
url = "2"
forklaunch-core = { path = "../../../../../framework-rs/crates/forklaunch-core", features = ["postgres", "encryption"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros", "uuid"], optional = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
forklaunch-axum = { path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["mcp"] }
forklaunch-core = { path = "../../../../../framework-rs/crates/forklaunch-core" }
forklaunch-contract = { path = "../../../../../framework-rs/crates/forklaunch-contract" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[[example]]
name = "http_parity"
required-features = ["http"]
