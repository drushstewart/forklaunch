[package]
name = "forklaunch-iam-better-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "dep:forklaunch-core"]

[dependencies]
forklaunch-blueprint-core = { path = "../../../forklaunch-blueprint-core" }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
zeroize = "1"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
forklaunch-core = { path = "../../../../../framework-rs/crates/forklaunch-core", features = ["postgres", "encryption"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros", "uuid"], optional = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
