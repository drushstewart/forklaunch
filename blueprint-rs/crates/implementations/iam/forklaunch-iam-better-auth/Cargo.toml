[package]
description = "ForkLaunch Rust iam better auth APIs and runtime support"
name = "forklaunch-iam-better-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
http = ["dep:axum", "dep:tower-http", "dep:reqwest", "dep:tracing"]
postgres = ["dep:sqlx", "dep:forklaunch-core", "forklaunch-core/postgres", "forklaunch-core/encryption"]
application-http = ["http", "dep:forklaunch-axum", "dep:forklaunch-auth", "dep:forklaunch-core", "dep:tower"]

[dependencies]
tracing = { version = "0.1", optional = true }
forklaunch-axum = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["mcp", "remote-jwks"], optional = true }
forklaunch-auth = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-auth", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
scrypt = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
ryu-js = "1.0"
icu_collator = "2.3"
icu_locale_core = "2.3"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
p521 = { version = "0.13.3", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
zeroize = "1"
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision", "preserve_order"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
url = "2"
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros", "uuid"], optional = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
forklaunch-axum = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["mcp"] }
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core" }
forklaunch-contract = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-contract" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[[example]]
name = "http_parity"
required-features = ["http"]

[[example]]
name = "application_contract"
required-features = ["application-http"]

[[example]]
name = "member_orm_parity"
required-features = ["http", "postgres"]
