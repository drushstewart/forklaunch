[package]
publish = false
description = "ForkLaunch Rust iam axum APIs and runtime support"
name = "forklaunch-iam-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
oidc-sessions = ["browser-sessions", "forklaunch-iam-base/browser-sessions", "forklaunch-iam-base/oidc-sessions", "forklaunch-core/oidc"]
browser-sessions = ["forklaunch-axum/cookie-session", "dep:tower-sessions"]

[dependencies]
tower-sessions = { version = "0.15", optional = true }
forklaunch-iam-base = { version = "=0.1.0", path = "../iam-base", features = ["postgres"] }
uuid = { version = "1", features = ["v4"] }
form_urlencoded = "1"
forklaunch-iam-interface = { version = "=0.1.0", path = "../../../interfaces/iam-interface" }
forklaunch-axum = { version = "=0.1.2", path = "../../../../../framework-rs/crates/axum", features = ["remote-jwks"] }
forklaunch-core = { version = "=0.1.2", path = "../../../../../framework-rs/crates/core", features = ["auth", "http", "domain"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
