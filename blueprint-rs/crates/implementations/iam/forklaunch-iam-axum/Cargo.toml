[package]
description = "ForkLaunch Rust iam axum APIs and runtime support"
name = "forklaunch-iam-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
browser-sessions = ["forklaunch-axum/cookie-session", "dep:tower-sessions"]

[dependencies]
tower-sessions = { version = "0.15", optional = true }
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-iam-base = { version = "0.1.0", path = "../forklaunch-iam-base", features = ["postgres"] }
uuid = { version = "1", features = ["v4"] }
form_urlencoded = "1"
forklaunch-iam-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-iam-interface" }
forklaunch-axum = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["remote-jwks"] }
forklaunch-auth = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-auth" }
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[lints]
workspace = true
