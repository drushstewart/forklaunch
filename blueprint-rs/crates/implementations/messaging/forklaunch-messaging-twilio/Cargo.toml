[package]
description = "ForkLaunch Rust messaging twilio APIs and runtime support"
name = "forklaunch-messaging-twilio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-messaging-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-messaging-interface" }
forklaunch-messaging-base = { version = "0.1.0", path = "../forklaunch-messaging-base" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
