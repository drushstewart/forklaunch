[package]
description = "ForkLaunch Rust messaging axum APIs and runtime support"
name = "forklaunch-messaging-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-messaging-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-messaging-interface" }
forklaunch-messaging-base = { version = "0.1.0", path = "../forklaunch-messaging-base", features = ["postgres"] }
forklaunch-messaging-twilio = { version = "0.1.0", path = "../forklaunch-messaging-twilio" }
forklaunch-axum = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["remote-jwks"] }
forklaunch-auth = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-auth", features = ["remote-jwks"] }
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core" }
axum = "0.8"
serde_json = "1"
form_urlencoded = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
