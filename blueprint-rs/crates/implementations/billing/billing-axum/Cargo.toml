[package]
publish = false
description = "ForkLaunch Rust billing axum APIs and runtime support"
name = "forklaunch-billing-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
typescript-routing = ["forklaunch-axum/typescript-routing"]
default = []
bound-checkout = ["forklaunch-billing-stripe/postgres-identity"]

[dependencies]
forklaunch-common = { version = "=0.1.3", path = "../../../../../framework-rs/crates/common", features = ["javascript-date"] }
forklaunch-validator = { version = "=0.1.3", path = "../../../../../framework-rs/crates/validator" }
forklaunch-billing-interface = { version = "=0.1.1", path = "../../../interfaces/billing-interface" }
forklaunch-billing-base = { version = "=0.1.1", path = "../billing-base", features = ["postgres"] }
forklaunch-billing-stripe = { version = "=0.1.1", path = "../billing-stripe" }
forklaunch-axum = { version = "=0.1.3", path = "../../../../../framework-rs/crates/axum", features = ["remote-jwks"] }
forklaunch-core = { version = "=0.1.3", path = "../../../../../framework-rs/crates/core", features = ["auth", "http", "remote-jwks", "domain"] }
axum = "0.8"
serde_json = "1"
form_urlencoded = "1"
serde = "1"
zeroize = "1"
chrono = "0.4"
tokio = { version="1", features=["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version="1", features=["macros","rt-multi-thread","net","sync"] }
reqwest = { version="0.13", default-features=false, features=["rustls","json"] }
sqlx = {version="0.9",default-features=false,features=["runtime-tokio","tls-rustls","postgres"]}
jsonwebtoken="11"
forklaunch-axum = { version = "=0.1.3",path="../../../../../framework-rs/crates/axum",features=["mcp","remote-jwks"]}
forklaunch-core = { version = "=0.1.3", path = "../../../../../framework-rs/crates/core", features = ["rust-sdk", "codegen", "typescript"]}

[lints]
workspace = true
