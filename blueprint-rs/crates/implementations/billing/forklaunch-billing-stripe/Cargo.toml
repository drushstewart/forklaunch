[package]
name = "forklaunch-billing-stripe"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
stripe-client = []

[dependencies]
forklaunch-billing-base = { path = "../forklaunch-billing-base" }
chrono = "0.4"
forklaunch-blueprint-core = { path = "../../../forklaunch-blueprint-core", features = ["provider-http", "stripe-webhook"] }
forklaunch-billing-interface = { path = "../../../interfaces/forklaunch-billing-interface" }

hmac = "0.12"
sha2 = "0.10"
subtle = "2"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[lints]
workspace = true
