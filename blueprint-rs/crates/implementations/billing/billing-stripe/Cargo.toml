[package]
description = "ForkLaunch Rust billing stripe APIs and runtime support"
name = "forklaunch-billing-stripe"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
stripe-client = []
postgres-reconciliation = ["forklaunch-billing-base/postgres"]
postgres-identity = ["forklaunch-billing-base/postgres"]

[dependencies]
forklaunch-core = { version = "=0.1.3", path = "../../../../../framework-rs/crates/core", features = ["http", "domain", "provider-http", "stripe-webhook", "instance-gateway"] }
forklaunch-billing-base = { version = "=0.1.1", path = "../billing-base" }
chrono = "0.4"
forklaunch-billing-interface = { version = "=0.1.1", path = "../../../interfaces/billing-interface" }

hmac = "0.12"
sha2 = "0.10"
subtle = "2"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
forklaunch-core = {version = "=0.1.3", path = "../../../../../framework-rs/crates/core", features = ["auth", "encryption", "postgres"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }

[lints]
workspace = true
