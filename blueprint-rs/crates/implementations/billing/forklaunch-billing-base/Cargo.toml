[package]
description = "ForkLaunch Rust billing base APIs and runtime support"
name = "forklaunch-billing-base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["dep:forklaunch-core", "dep:sqlx", "dep:tokio"]

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-billing-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-billing-interface" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core", features = ["postgres", "encryption"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"], optional = true }

tokio = { version = "1", default-features = false, features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
