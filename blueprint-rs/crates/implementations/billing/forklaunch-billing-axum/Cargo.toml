[package]
description = "ForkLaunch Rust billing axum APIs and runtime support"
name = "forklaunch-billing-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
typescript-routing = ["forklaunch-axum/typescript-routing"]
default = []
bound-checkout = ["forklaunch-billing-stripe/postgres-identity"]

[dependencies]
forklaunch-common = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-common", features = ["javascript-date"] }
forklaunch-http = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-http" }
forklaunch-validation = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-validation" }
forklaunch-blueprint-core = { version = "0.1.0", path = "../../../forklaunch-blueprint-core" }
forklaunch-billing-interface = { version = "0.1.0", path = "../../../interfaces/forklaunch-billing-interface" }
forklaunch-billing-base = { version = "0.1.0", path = "../forklaunch-billing-base", features = ["postgres"] }
forklaunch-billing-stripe = { version = "0.1.0", path = "../forklaunch-billing-stripe" }
forklaunch-axum = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-axum", features = ["remote-jwks"] }
forklaunch-auth = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-auth", features = ["remote-jwks"] }
forklaunch-core = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-core" }
axum = "0.8"
serde_json = "1"
form_urlencoded = "1"
serde = "1"
zeroize = "1"
chrono = "0.4"
tokio = { version="1", features=["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
forklaunch-sdk-rust = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-sdk-rust" }
forklaunch-sdk-codegen = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-sdk-codegen" }
forklaunch-sdk-typescript = { version = "0.1.0", path = "../../../../../framework-rs/crates/forklaunch-sdk-typescript" }
tokio = { version="1", features=["macros","rt-multi-thread","net","sync"] }
reqwest = { version="0.12", default-features=false, features=["rustls-tls","json"] }
sqlx = {version="0.8",default-features=false,features=["runtime-tokio","tls-rustls","postgres"]}
jsonwebtoken="9"
forklaunch-axum = { version = "0.1.0",path="../../../../../framework-rs/crates/forklaunch-axum",features=["mcp","remote-jwks"]}

[lints]
workspace = true
