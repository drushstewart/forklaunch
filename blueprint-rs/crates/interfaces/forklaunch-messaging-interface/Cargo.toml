[package]
description = "ForkLaunch Rust messaging interface APIs and runtime support"
name = "forklaunch-messaging-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-blueprint-core = { version = "0.1.0", path = "../../forklaunch-blueprint-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
