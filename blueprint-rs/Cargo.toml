[workspace]
resolver = "3"
exclude = ["crates/vendor/bullmq-official"]
members = [
    "crates/forklaunch-blueprint-core",
    "crates/interfaces/forklaunch-iam-interface",
    "crates/interfaces/forklaunch-cac-interface",
    "crates/interfaces/forklaunch-messaging-interface",
    "crates/interfaces/forklaunch-ecommerce-interface",
    "crates/interfaces/forklaunch-billing-interface",
    "crates/interfaces/forklaunch-worker-interface",
    "crates/interfaces/forklaunch-monitoring-interface",
    "crates/implementations/iam/forklaunch-iam-base",
    "crates/implementations/cac/forklaunch-cac-base",
    "crates/implementations/messaging/forklaunch-messaging-base",
    "crates/implementations/ecommerce/forklaunch-ecommerce-base",
    "crates/implementations/ecommerce/forklaunch-ecommerce-axum",
    "crates/implementations/ecommerce/forklaunch-ecommerce-stripe",
    "crates/implementations/ecommerce/forklaunch-ecommerce-paypal",
    "crates/implementations/messaging/forklaunch-messaging-twilio",
    "crates/implementations/messaging/forklaunch-messaging-axum",
    "crates/implementations/cac/forklaunch-cac-axum",
    "crates/implementations/iam/forklaunch-iam-axum",
    "crates/implementations/billing/forklaunch-billing-base",
    "crates/implementations/billing/forklaunch-billing-stripe",
    "crates/implementations/billing/forklaunch-billing-axum",
    "crates/implementations/billing/forklaunch-billing-axum",
    "crates/implementations/worker/forklaunch-worker-database",
    "crates/implementations/worker/forklaunch-worker-redis",
    "crates/implementations/worker/forklaunch-worker-kafka",
    "crates/client-sdk",
    "crates/sample-app",
    "crates/sample-service",
    "crates/sample-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "ISC"
authors = ["Forklift Technologies, Inc. <engineering@forklaunch.com>"]
repository = "https://github.com/forklaunch/forklaunch-js"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
